<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>instaWork — Iniciar sesión</title>
  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/login.css"/>
</head>
<body class="login-page">
  <div class="login-header">
    <span class="logo">insta<span>Work</span></span>
  </div>

  <div class="login-wrap">
    <p id="authLoading" class="sub">Verificando sesión…</p>
    <div id="loginContent" class="hidden">
    <div class="card login-card">
      <h1>Bienvenido a instaWork</h1>
      <p class="sub">Inicia sesión para empezar tu búsqueda automática.</p>
      <button type="button" id="ggeneric" class="btn primary google-btn">Continuar con Google</button>
      <div class="login-divider">o</div>

      <form id="emailForm" class="login-form">
        <input id="gemail" type="email" placeholder="tu@email.com" autocomplete="email" required/>
        <input id="gpassword" type="password" placeholder="Contraseña (mín. 6 caracteres)" autocomplete="current-password" minlength="6" required/>
        <p id="loginError" class="login-error hidden"></p>
        <button type="submit" id="gemailbtn" class="btn primary">Iniciar sesión</button>
      </form>

      <button type="button" id="toggleMode" class="login-toggle">¿No tienes cuenta? Crear cuenta</button>
      <p class="sub login-legal">Al continuar aceptas los Términos y la Política de Privacidad.</p>
    </div>
    </div>
  </div>

  <script src="js/engine.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
